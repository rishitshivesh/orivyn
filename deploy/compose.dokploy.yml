services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        INSTALL_CACTUS: ${INSTALL_CACTUS:-false}
    restart: unless-stopped
    environment:
      ORIVYN_INFERENCE_PROVIDER: ${ORIVYN_INFERENCE_PROVIDER:-disabled}
      ORIVYN_API_KEY: ${ORIVYN_API_KEY:?Set a private service key}
      ORIVYN_ALLOWED_ORIGINS: ${ORIVYN_ALLOWED_ORIGINS:-}
      CACTUS_TELEMETRY: "0"
      ORIVYN_CHAT_PROVIDER: ${ORIVYN_CHAT_PROVIDER:-disabled}
      ORIVYN_CHAT_BASE_URL: ${ORIVYN_CHAT_BASE_URL:-https://api.openai.com/v1}
      ORIVYN_CHAT_API_KEY: ${ORIVYN_CHAT_API_KEY:-}
      ORIVYN_CHAT_MODEL: ${ORIVYN_CHAT_MODEL:-}
    expose:
      - "8080"
    volumes:
      - model_cache:/home/orivyn/.cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health/live',timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  model_cache:
